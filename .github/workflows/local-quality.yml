name: Local Quality Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Local regression tests
        run: npm run test:release-local
      - name: Verify migration files (offline, no SQL execution)
        run: npm run check:migrations
      - name: Production build and type checking
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Isolated material component browser regression
        run: npm run test:browser-material
